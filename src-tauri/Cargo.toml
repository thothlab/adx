[package]
name = "adx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ADX — Android Device eXplorer"

[lib]
name = "adx_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adx-core.workspace = true
adx-mtp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = [] }
# Already compiled as a dependency of `tauri` itself, so naming it here adds a
# TLS backend and nothing else. `rustls` rather than the system one: it is the
# same code on all three systems, and an update check that works on macOS and
# quietly fails on Linux is worse than one that does not exist.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
