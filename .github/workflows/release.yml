name: release

# Собирает установщики под три системы и выкладывает их в релиз GitHub.
#
# Запуск: пуш тега `v*` (обычный путь) либо вручную через workflow_dispatch с
# указанием тега — второе нужно, чтобы пересобрать релиз, не переставляя тег.
#
# Подписи нет ни на одной системе. На macOS это значит, что Gatekeeper покажет
# «приложение повреждено или его автор не установлен»; лечится либо Apple
# Developer ID (тогда сюда добавляются секреты APPLE_*), либо инструкцией для
# пользователя. Оставлено осознанно: сертификата у проекта пока нет, и молча
# выпускать сборку, делая вид, что она подписана, хуже, чем сказать об этом.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0"
        required: true
        type: string

jobs:
  # Релиз создаётся один раз, отдельным заданием, и только потом в него заливают.
  #
  # Иначе каждое из трёх заданий само проверяет «релиза нет — создам», и два
  # закончивших одновременно дерутся за создание: одно получает ошибку и роняет
  # свою систему уже после успешной сборки. На первом же прогоне это и вышло —
  # Linux собрал все три пакета и упал на создании релиза.
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      # Нужен только ради текста релиза — он лежит в репозитории, а не здесь.
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: create
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;

            // Текст релиза живёт в `.github/release-notes.md`, рядом с кодом, и
            // правится тем же коммитом, что и функция, о которой рассказывает.
            // Захардкоженный здесь, он один раз уже соврал: полгода обещал, что
            // скачивание с устройства «ещё не сделано», хотя оно работало и было
            // прогнано на телефоне. Файл в репозитории виден в ревью диффа,
            // строка внутри workflow — нет.
            const fs = require('fs');
            const NOTES = '.github/release-notes.md';
            const body = fs.existsSync(NOTES)
              ? fs.readFileSync(NOTES, 'utf8')
              : `Сборки ADX для macOS, Windows и Linux. Тег ${tag}.`;

            // Существующий релиз переиспользуется: перезапуск упавшего задания не
            // должен спотыкаться о собственный результат предыдущего прогона.
            const existing = await github.rest.repos
              .getReleaseByTag({ ...context.repo, tag })
              .catch(() => null);
            if (existing) return existing.data.id;

            const created = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `ADX ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return created.data.id;
          result-encoding: string

  build:
    needs: create-release
    permissions:
      # tauri-action заливает файлы в уже созданный релиз.
      contents: write

    strategy:
      # Одна упавшая система не должна отменять две другие: собранное всё равно
      # попадёт в релиз, а чинить останется только её.
      fail-fast: false
      matrix:
        include:
          # Универсальный бинарь вместо двух отдельных сборок: пользователю не
          # надо выбирать между Intel и Apple silicon, а нам — объяснять разницу.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            label: macOS
          # 22.04, а не latest: собранное на более новой glibc не запустится на
          # более старой, и обратной совместимости здесь нет.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            label: Linux
          - platform: windows-latest
            args: ""
            rust-targets: ""
            label: Windows

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      # Версия берётся из поля packageManager в package.json — задавать её ещё и
      # здесь значит завести второй источник правды, который однажды разойдётся.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Цель сборки лежит в корне репозитория: src-tauri — участник cargo
      # workspace, поэтому target общий и путь не тот, что в шаблоне Tauri.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Тесты
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Черновик снимается только после того, как все три системы отчитались. Релиз,
  # опубликованный до этого, какое-то время показывает пользователям неполный
  # набор файлов — и молча, потому что о недостающей системе он ничего не знает.
  publish:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
