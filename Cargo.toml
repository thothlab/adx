[workspace]
resolver = "2"
members = ["src-tauri", "crates/adx-core", "crates/adx-mtp"]

[workspace.package]
version = "1.0.4"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["ADX contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures = "0.3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"

# MTP transport. Pinned exactly: the crate is young (0.30.0, released
# 2026-08-10) and ships breaking changes every few days, so an upgrade is a
# deliberate act, never a `cargo update` side effect. Every call site lives
# behind the `MtpBackend` trait in `adx-mtp`.
mtp-rs = "=0.30.0"

adx-core = { path = "crates/adx-core" }
adx-mtp = { path = "crates/adx-mtp" }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
