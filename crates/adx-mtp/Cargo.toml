[package]
name = "adx-mtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MTP backend for ADX — the only crate that knows about mtp-rs"

[dependencies]
adx-core.workspace = true
serde.workspace = true
tracing.workspace = true
mtp-rs.workspace = true
futures.workspace = true
# `io-util` on top of the workspace set: the download executor writes each
# window to disk with `AsyncWriteExt::write_all`, which lives behind it.
tokio = { workspace = true, features = ["io-util"] }

# Bridges a `tokio::fs::File` to the `Stream<Item = Result<Bytes, io::Error>>`
# that `Storage::upload` wants. Streaming rather than reading the file in:
# uploads here are routinely gigabytes of video, and MTP needs only the length
# upfront, not the bytes.
tokio-util = { version = "0.7", features = ["io"] }

# Raw USB enumeration, used for one thing only: telling "no device attached"
# apart from "device attached in charging-only mode". `mtp-rs` deliberately
# lists MTP candidates only, so a phone with no MTP interface is invisible
# there — and that is the case where the user needs a different instruction.
# Version tracks the one mtp-rs itself resolves, so both share a single
# enumeration backend rather than fighting over the device.
nusb = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
